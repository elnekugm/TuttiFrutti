name: release-binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag and build version
        type: string
        default: build-1.1
      publish_release:
        description: Publish the four packages as a GitHub release
        type: boolean
        default: true

permissions:
  contents: read

# Clang major the Linux PGO build uses, from apt.llvm.org. A profile is written by a current clang
# and an older reader refuses it, so this has to stay at or above whatever produced
# eglantine.profdata; bump it when a refreshed profile needs a newer LLVM.
env:
  PGO_LLVM_VERSION: "23"

# A running build is never cancelled: it finishes and publishes. A push meanwhile queues one build;
# a later push replaces it, so the newest commit builds as soon as the running one is done.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare release tag
        if: inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          if [[ ! "$tag" =~ ^build-[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::release_tag must look like build-1 or build-1.1, got '$tag'"
            exit 1
          fi
          if tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Release tag $tag points to $tag_sha instead of $GITHUB_SHA"
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi

  build:
    name: ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Four clean public builds from fresh runners and empty build directories: Windows and
          # Linux, each for x86-64-v3 (AVX2) and for AMD Zen 3 (znver3), all Release, built with
          # the checked-in PGO profile and ThinLTO.
          - platform: linux-x86_64-pgo
            runner: ubuntu-24.04
            preset: v3
            profile: eglantine.profdata
          - platform: linux-x86_64-znver3-pgo
            runner: ubuntu-24.04
            preset: zen3
            profile: eglantine.profdata
          - platform: windows-x86_64-pgo
            runner: windows-2022
            preset: v3
            profile: lichii-windows.profdata
          - platform: windows-x86_64-znver3-pgo
            runner: windows-2022
            preset: zen3
            profile: lichii-windows.profdata

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev llvm python3-zstandard \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt on Linux
        if: startsWith(matrix.platform, 'linux')
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      # Ubuntu's own clang 18 cannot read a profile from a current LLVM, so take clang from the LLVM
      # apt repo. The versioned packages are named explicitly: that repo's unversioned clang/lld
      # metapackages can lag the binaries they depend on and then resolve to nothing. lld-23 only
      # ships ld.lld under /usr/lib/llvm-23/bin, so -B points the linker search there. llvm-23
      # supplies llvm-profdata, llvm-ar and llvm-ranlib for the profile check and ThinLTO archives.
      - name: Install clang for PGO
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION" "llvm-$PGO_LLVM_VERSION"
          "clang-$PGO_LLVM_VERSION" --version
          "/usr/lib/llvm-$PGO_LLVM_VERSION/bin/llvm-profdata" --version

      # A profile that an older llvm-profdata cannot read, or that holds no functions, would leave
      # every function unoptimized. Refuse to build instead of publishing a package without PGO.
      - name: Validate the Linux PGO profile
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ matrix.profile }}"
          profdata="/usr/lib/llvm-$PGO_LLVM_VERSION/bin/llvm-profdata"
          test -x "$profdata"
          summary=$("$profdata" show "${{ matrix.profile }}")
          printf '%s\n' "$summary" | sed -n '1,20p'
          grep -Eq 'Total functions:[[:space:]]*[1-9][0-9]*' <<< "$summary"

      - name: Set up MSVC
        if: startsWith(matrix.platform, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      # clang-cl compiles against the MSVC headers, libraries and SDK that the previous step put
      # on PATH; only the compiler, linker and archiver come from this LLVM.
      - name: Install LLVM on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Validate the Windows PGO profile
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $profdata = Join-Path $env:LLVM_ROOT 'bin/llvm-profdata.exe'
          if (-not (Test-Path $profdata)) { throw "llvm-profdata.exe was not installed" }
          if (-not (Test-Path '${{ matrix.profile }}')) { throw "${{ matrix.profile }} is missing" }
          $summary = & $profdata show '${{ matrix.profile }}' 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Invalid PGO profile: $summary" }
          $summary | Select-Object -First 20
          if (-not ($summary -match 'Total functions:\s*[1-9][0-9]*')) {
            throw "The PGO profile holds no functions"
          }

      - name: Install Qt on Windows
        if: startsWith(matrix.platform, 'windows')
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: glslangValidator --version

      # Release options only: no tests, Catch2, benchmarks, fuzzers, CLI or debug tools. The
      # compiler is clang, so the profile and ThinLTO flags are ordinary clang flags.
      - name: Configure Linux
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          profile="-fprofile-use=$PWD/${{ matrix.profile }} -flto=thin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date -Wno-backend-plugin"
          # ThinLTO turns the .o files into LLVM bitcode that Ubuntu's llvm-ar 18 cannot read.
          # Use clang's own llvm-ar when it is installed; otherwise GNU ar archives the bitcode
          # as opaque members, which lld reads fine.
          ar=/usr/bin/ar
          ranlib=/usr/bin/ranlib
          if [ -x "/usr/lib/llvm-$PGO_LLVM_VERSION/bin/llvm-ar" ]; then
            ar="/usr/lib/llvm-$PGO_LLVM_VERSION/bin/llvm-ar"
            ranlib="/usr/lib/llvm-$PGO_LLVM_VERSION/bin/llvm-ranlib"
          fi
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLICHII_TESTS=OFF \
            -DLICHII_CMD=OFF \
            -DLICHII_ROOM=OFF \
            -DLICHII_ROOM_STANDALONE=OFF \
            -DLICHII_FUZZERS=OFF \
            -DENABLE_DEBUG_TOOLS=OFF \
            -DLICHII_USE_BUNDLED_QT=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            -DLICHII_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DLICHII_BUILD_TAG=${{ inputs.release_tag }} \
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
            -DLICHII_BUILD_PRESET=${{ matrix.preset }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=OFF \
            "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION" \
            "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION" \
            "-DCMAKE_AR=$ar" \
            "-DCMAKE_RANLIB=$ranlib" \
            "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld" \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      # A profile older than the source only warns: functions changed since training lose their
      # profile data and are optimized as in the ThinLTO build. clang-cl 22 reads LLVM's indexed
      # profile format 13, so the profile must come from the LLVM that tools/windows installs.
      - name: Configure Windows
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          flags+=" -fprofile-use=$(cygpath -m "$PWD/${{ matrix.profile }}")"
          flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
          flags+=" -Wno-error=backend-plugin"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLICHII_TESTS=OFF \
            -DLICHII_CMD=OFF \
            -DLICHII_ROOM=OFF \
            -DLICHII_ROOM_STANDALONE=OFF \
            -DLICHII_FUZZERS=OFF \
            -DENABLE_DEBUG_TOOLS=OFF \
            -DLICHII_USE_BUNDLED_QT=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            -DLICHII_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DLICHII_BUILD_TAG=${{ inputs.release_tag }} \
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
            -DLICHII_BUILD_PRESET=${{ matrix.preset }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=OFF \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_EXE_LINKER_FLAGS=/OPT:REF /OPT:ICF" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      # The release packages hold the emulator (and the Windows update helper), never a test,
      # benchmark, CLI or debug tool.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          targets=(lichii)
          if [[ "${{ matrix.platform }}" == windows* ]]; then
            targets+=(lichii-updater)
          fi
          cmake --build build/release --target "${targets[@]}" --parallel

      # Fail before packaging if the build is not the promised one: Release, PGO use (never
      # instrumentation), ThinLTO and the requested CPU target. The same step records the evidence.
      - name: Verify release flags
        shell: bash
        run: |
          set -euo pipefail
          cache=build/release/CMakeCache.txt
          ninja=build/release/build.ninja
          test -f "$cache"
          test -f "$ninja"

          grep -Eq '^CMAKE_BUILD_TYPE:STRING=Release$' "$cache"
          grep -Eq '^BUILD_TESTING:BOOL=OFF$' "$cache"
          grep -Eq '^LICHII_TESTS:BOOL=OFF$' "$cache"
          grep -Eq '^LICHII_CMD:BOOL=OFF$' "$cache"
          grep -Eq '^LICHII_FUZZERS:BOOL=OFF$' "$cache"
          grep -Eq '^ENABLE_DEBUG_TOOLS:BOOL=OFF$' "$cache"
          grep -Eq '^LICHII_BUILD_PRESET:STRING=${{ matrix.preset }}$' "$cache"
          grep -Eq '^LICHII_BUILD_PLATFORM:STRING=${{ matrix.platform }}$' "$cache"

          grep -Eq -- '(-DNDEBUG|/DNDEBUG)' "$ninja"
          grep -F -- '-fprofile-use=' "$ninja" > /dev/null
          grep -F -- '-flto=thin' "$ninja" > /dev/null

          case "${{ matrix.preset }}" in
            v3) cpu=x86-64-v3 ;;
            zen3) cpu=znver3 ;;
            *) echo "::error::unknown preset ${{ matrix.preset }}"; exit 1 ;;
          esac
          grep -F -- "-march=$cpu" "$ninja" > /dev/null

          if grep -F -- '-fprofile-instr-generate' "$ninja" > /dev/null ||
             grep -F -- '-fprofile-generate' "$ninja" > /dev/null; then
            echo "::error::the release build carries PGO instrumentation"
            exit 1
          fi

          echo "Release: $(grep -E '^CMAKE_BUILD_TYPE:STRING=' "$cache")"
          echo "PGO use: $(grep -oE -- '-fprofile-use=[^ ]+' "$ninja" | sort -u | sed -n '1p')"
          echo "ThinLTO: $(grep -m1 -oE -- '-flto=thin' "$ninja")"
          echo "CPU target: $(grep -m1 -oE -- "-march=$cpu" "$ninja")"
          echo "Tests, CLI, fuzzers and debug tools: OFF"

      # fsr4-vk, the community Vulkan port of FSR 4 that the x86-64 Linux package ships
      # (tools/fsr4-vk/build.sh pins its commit and AMD's DLL it is built from).
      - name: Build fsr4-vk
        if: startsWith(matrix.platform, 'linux-x86_64')
        shell: bash
        run: bash tools/fsr4-vk/build.sh "$RUNNER_TEMP/fsr4-vk-work" "$RUNNER_TEMP/fsr4-vk"

      # The AppImage is self-contained: linuxdeploy bundles every library the emulator needs except
      # the base system ones (glibc, X11/Wayland client libraries, the GPU driver and Vulkan loader),
      # and its Qt plugin adds the Qt libraries and platform plugins. linuxdeploy's own exclude list
      # lacks libvulkan.so.1, so it is excluded by name: the bundled loader replaced the system one
      # and failed Vulkan init (#1767). Only the emulator, its runtime resources, the licences and
      # the user README ship; the CLI, tests, benchmarks and debug files are not part of it.
      - name: Package the Linux AppImage
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          bin=build/release/bin
          test -x "$bin/TuttiFrutti"
          for unexpected in "$bin/TuttiFrutti-cli" "$bin/tests"; do
            if [ -e "$unexpected" ]; then
              echo "::error::$unexpected must not exist in a release build"
              exit 1
            fi
          done
          strip "$bin/TuttiFrutti"

          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch=$(uname -m)
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage"
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage"
          chmod +x "$tools"/*.AppImage

          icon="$RUNNER_TEMP/io.github.zortos293.lichii.png"
          cp dist/lichii.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Include Wayland platform plugins and their graphics/shell integrations.
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          # Embedded in the AppImage metadata; matches the release tag plus the commit.
          export LDAI_VERSION="${{ inputs.release_tag }}-${GITHUB_SHA::7}"
          output="TuttiFrutti-${GITHUB_SHA}-${{ matrix.platform }}.AppImage"
          export LDAI_OUTPUT="$output" OUTPUT="$output" ARCH="$arch"

          mkdir -p AppDir/usr/bin AppDir/usr/share/licenses AppDir/usr/share/doc/tuttifrutti
          cp "$bin/nx2_switches.txt" AppDir/usr/bin/
          cp LICENSE.txt README.md AppDir/usr/share/doc/tuttifrutti/
          fsr4=amd_fidelityfx_upscaler_vk.so
          cp -r "$RUNNER_TEMP/fsr4-vk/licenses/fsr4-vk" AppDir/usr/share/licenses/

          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable "$bin/TuttiFrutti" \
            --library "$RUNNER_TEMP/fsr4-vk/$fsr4" \
            --exclude-library 'libvulkan.so*' \
            --desktop-file dist/io.github.zortos293.lichii.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$output"

          # Inspect the finished AppImage, not the staging folder: list every file and reject the
          # artifacts a development build would leave behind.
          extract="$RUNNER_TEMP/appimage-check"
          rm -rf "$extract"
          mkdir -p "$extract"
          (cd "$extract" && "$GITHUB_WORKSPACE/$output" --appimage-extract > /dev/null)
          root="$extract/squashfs-root"
          test -x "$root/usr/bin/TuttiFrutti"
          test -f "$root/usr/bin/nx2_switches.txt"
          test -f "$root/usr/share/doc/tuttifrutti/LICENSE.txt"
          test -f "$root/usr/share/doc/tuttifrutti/README.md"
          test -f "$root/usr/share/licenses/fsr4-vk/LICENSE"
          test -f "$root/usr/lib/$fsr4"
          nm -D --defined-only "$root/usr/lib/$fsr4" | grep -w ffxCreateContext > /dev/null
          if [ -n "$(find "$root" -name 'libvulkan.so*' -print -quit)" ]; then
            echo "::error::The AppImage bundles the Vulkan loader"
            exit 1
          fi
          forbidden=$(find "$root" \( \
            -name 'TuttiFrutti-cli*' -o -name 'tests*' -o -name '*_tests*' \
            -o -name '*bench*' -o -name '*.pdb' -o -name '*.profraw' -o -name '*.profdata' \
            -o -name '*.ilk' -o -name '*.lib' -o -name '*.exp' -o -name '*.obj' \
            -o -name '*.a' -o -name '*.h' \) -print)
          if [ -n "$forbidden" ]; then
            echo "::error::Development files in the AppImage:"
            echo "$forbidden"
            exit 1
          fi
          echo "AppImage contents ($(find "$root" -type f | wc -l) files):"
          find "$root" -type f | sed "s|$root/||" | sort
          ls -lh "$output"

      # A clean Windows package: the emulator and its update helper, windeployqt's runtime DLLs and
      # Qt plugins, the licence, the user README and the portable profile note. No PDB, test,
      # benchmark, CLI, profraw/profdata, import library or object file goes into the zip.
      - name: Package the Windows zip
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'build/release/bin'
          foreach ($file in 'TuttiFrutti.exe', 'TuttiFrutti-updater.exe', 'nx2_switches.txt',
                            'qt.conf', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll',
                            'Qt6Network.dll', 'plugins/platforms/qwindows.dll') {
            if (-not (Test-Path "$bin/$file")) { throw "$bin/$file was not produced" }
          }
          $unexpected = Get-ChildItem $bin -File | Where-Object {
            $_.Name -in @('TuttiFrutti-cli.exe', 'tests.exe') -or
            $_.Name -like '*_tests.exe' -or $_.Name -like '*bench*'
          }
          if ($unexpected) { throw "Test, CLI or benchmark binaries were built: $unexpected" }

          # lichii's POST_BUILD windeployqt already copied Qt and its plugins into plugins/, which is
          # what qt.conf uses. Running it again would duplicate every plugin at the root.
          Get-ChildItem $bin -Recurse -File -Include *.pdb,*.profraw,*.profdata,*.ilk,*.lib,*.exp,*.obj,*.a |
            Remove-Item -Force
          Remove-Item "$bin/vc_redist.x64.exe" -Force -ErrorAction SilentlyContinue

          # The build uses the DLL runtime (/MD), so ship the MSVC CRT files it imports. Windows
          # itself provides only the UCRT (api-ms-win-crt-*), not VCRUNTIME140 or MSVCP140.
          if (-not $env:VCToolsRedistDir) { throw "VCToolsRedistDir is not set; MSVC setup did not run" }
          $crtRoot = Join-Path $env:VCToolsRedistDir 'x64'
          $crt = Get-ChildItem $crtRoot -Directory -Filter 'Microsoft.VC*.CRT' |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $crt) { throw "No MSVC CRT redistributable under $crtRoot" }
          Copy-Item (Join-Path $crt.FullName '*.dll') $bin -Force
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            if (-not (Test-Path "$bin/$dll")) { throw "$dll was not copied from $($crt.FullName)" }
          }

          # Portable profile: this folder beside TuttiFrutti.exe keeps the config, saves and cache
          # here, and the first start offers to import the previous profile.
          New-Item -ItemType Directory -Force "$bin/user" | Out-Null
          @(
            'TuttiFrutti portable / portátil',
            '',
            'Esta carpeta "user" guarda la configuración, partidas, NAND y caché del emulador aquí,',
            'junto a TuttiFrutti.exe, en vez de en %APPDATA%\lichii.',
            '',
            'This "user" folder keeps the emulator config, saves, NAND and cache here next to',
            'TuttiFrutti.exe instead of in %APPDATA%\lichii. Delete or rename it to use the normal profile.'
          ) | Set-Content -Path "$bin/user/LEEME.txt" -Encoding utf8
          Copy-Item LICENSE.txt, README.md $bin -Force

          $forbidden = Get-ChildItem $bin -Recurse -File | Where-Object {
            $_.Name -in @('TuttiFrutti-cli.exe', 'tests.exe') -or
            $_.Name -match '(_tests|tests|bench|probe)\.exe$' -or
            $_.Extension -in @('.pdb', '.profraw', '.profdata', '.ilk', '.lib', '.exp', '.obj', '.a', '.h')
          }
          if ($forbidden) {
            throw "Development files would be packaged: $($forbidden.FullName -join ', ')"
          }

          $zip = "TuttiFrutti-${env:GITHUB_SHA}-${{ matrix.platform }}.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          # Write the zip entry names with forward slashes: Compress-Archive stores Windows
          # backslashes, which some Linux extractors read as part of the file name.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root = (Resolve-Path $bin).Path.TrimEnd('\') + '\'
          $archive = [System.IO.Compression.ZipFile]::Open($zip, 'Create')
          Get-ChildItem $bin -Recurse -File | ForEach-Object {
            $entry = $_.FullName.Substring($root.Length).Replace('\', '/')
            [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
              $archive, $_.FullName, $entry,
              [System.IO.Compression.CompressionLevel]::Optimal) | Out-Null
          }
          $archive.Dispose()

          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          $names = $archive.Entries.FullName | Sort-Object
          $archive.Dispose()
          foreach ($required in 'TuttiFrutti.exe', 'TuttiFrutti-updater.exe', 'nx2_switches.txt',
                                'qt.conf', 'vcruntime140.dll', 'msvcp140.dll',
                                'plugins/platforms/qwindows.dll',
                                'LICENSE.txt', 'README.md', 'user/LEEME.txt') {
            if ($names -notcontains $required) { throw "$zip is missing $required" }
          }
          $bad = $names | Where-Object {
            $_ -match '(^|/)(tests|.*_tests|.*bench.*|TuttiFrutti-cli)(\.exe)?$' -or
            $_ -match '\.(pdb|profraw|profdata|ilk|lib|exp|obj|a|h)$' -or
            $_ -match '^(generic|iconengines|imageformats|networkinformation|platforms|styles|tls)/'
          }
          if ($bad) { throw "Development files or duplicate Qt plugin folders in ${zip}: $bad" }
          "Windows zip contents ($($names.Count) entries):"
          $names
          Get-Item $zip | Select-Object Name, Length

      # One artifact per variant, holding the single public file the release job publishes.
      - name: Upload the Windows package
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: TuttiFrutti-${{ matrix.platform }}-${{ github.sha }}
          path: TuttiFrutti-${{ github.sha }}-${{ matrix.platform }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload the Linux AppImage
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v7
        with:
          name: TuttiFrutti-${{ matrix.platform }}-${{ github.sha }}
          path: TuttiFrutti-${{ github.sha }}-${{ matrix.platform }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Publishes the four packages only after every variant built and packaged. The release is created
  # as a draft, its assets are uploaded and verified, and only then does it become public: a
  # failure leaves no partial public release behind.
  release:
    name: Publish release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: TuttiFrutti-*-${{ github.sha }}
          path: artifacts

      - name: Collect and verify the four packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            name=${name/-${GITHUB_SHA}/}
            cp "$file" "dist/$name"
          done < <(find artifacts -type f \( -name '*.zip' -o -name '*.AppImage' \) -print0)

          cat > expected.txt <<'EOF'
          TuttiFrutti-linux-x86_64-pgo.AppImage
          TuttiFrutti-linux-x86_64-znver3-pgo.AppImage
          TuttiFrutti-windows-x86_64-pgo.zip
          TuttiFrutti-windows-x86_64-znver3-pgo.zip
          EOF
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > actual.txt
          diff -u expected.txt actual.txt
          while IFS= read -r name; do
            test -s "dist/$name"
          done < expected.txt
          for package in dist/*.zip; do
            unzip -tq "$package"
          done
          file dist/*.AppImage
          ls -lh dist
          sha256sum dist/* | tee SHA256SUMS.txt

      - name: Create, fill and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag ${tag} points to $tag_sha instead of $GITHUB_SHA"
            exit 1
          fi
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::A release for ${tag} already exists; refusing to replace it"
            exit 1
          fi

          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          cat > notes.md <<EOF
          TuttiFrutti ${tag}, built automatically from ${GITHUB_SHA}.

          All four packages are Release builds with profile-guided optimization (PGO use) and
          ThinLTO. They contain only the emulator, its runtime libraries and resources, the licence
          and the user README: no tests, benchmarks, PGO instrumentation, debug symbols or build
          intermediates.

          | Variant | CPU target | Download |
          | --- | --- | --- |
          | Windows x64 (x86-64-v3) | AVX2: Intel Haswell+, AMD Ryzen 1000+ | [TuttiFrutti-windows-x86_64-pgo.zip](${base}/TuttiFrutti-windows-x86_64-pgo.zip) |
          | Windows x64 (AMD Zen 3) | znver3: Ryzen 5000+, EPYC 7003+ | [TuttiFrutti-windows-x86_64-znver3-pgo.zip](${base}/TuttiFrutti-windows-x86_64-znver3-pgo.zip) |
          | Linux x64 (AppImage, x86-64-v3) | AVX2: Intel Haswell+, AMD Ryzen 1000+ | [TuttiFrutti-linux-x86_64-pgo.AppImage](${base}/TuttiFrutti-linux-x86_64-pgo.AppImage) |
          | Linux x64 (AppImage, AMD Zen 3) | znver3: Ryzen 5000+, EPYC 7003+ | [TuttiFrutti-linux-x86_64-znver3-pgo.AppImage](${base}/TuttiFrutti-linux-x86_64-znver3-pgo.AppImage) |

          Use a znver3 package only on an AMD Zen 3 or newer CPU. Every other x86-64 machine uses the
          x86-64-v3 package.

          ### Windows

          Extract the whole zip and run TuttiFrutti.exe. The zip ships a user folder beside it: with
          that folder present the emulator keeps its config, saves, NAND and cache there (portable),
          and the first start offers to import your previous profile. Delete or rename user to use
          the normal %APPDATA%\lichii profile instead.

          ### Linux

          Make the AppImage executable (chmod +x) and run it. It needs glibc 2.39 or newer
          (CachyOS, Arch, Ubuntu 24.04, Fedora 40, Debian 13) and a Vulkan driver. The AppImage uses
          your normal profile under \$XDG_DATA_HOME (usually ~/.local/share/lichii).
          EOF

          created=0
          published=0
          cleanup() {
            status=$?
            if [ "$created" = 1 ] && [ "$published" = 0 ]; then
              echo "::warning::Removing the unpublished draft release ${tag}"
              gh release delete "$tag" --repo "${GITHUB_REPOSITORY}" --yes > /dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          gh release create "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "TuttiFrutti ${tag}" \
            --notes-file notes.md
          created=1

          gh release upload "$tag" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

          count=$(gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')
          if [ "$count" != 4 ]; then
            echo "::error::The draft release holds $count assets instead of 4"
            exit 1
          fi
          asset_names=$(gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json assets \
            --jq '.assets[].name')
          while IFS= read -r name; do
            grep -Fxq "$name" <<< "$asset_names"
          done < expected.txt

          gh release edit "$tag" --repo "${GITHUB_REPOSITORY}" --draft=false
          published=1
          trap - EXIT
          echo "Published ${tag} with four clean packages."

      # LICHII_BUILD_TAG is baked into every binary and the update checker compares release tags
      # against it. A release whose tag or title names another version would be skipped or offered
      # wrongly, so fail the run instead of leaving it published.
      - name: Verify the published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="${{ inputs.release_tag }}"
          view=$(gh release view "$expected" --repo "${GITHUB_REPOSITORY}" --json tagName,name,isDraft,assets)
          echo "$view" | jq .
          test "$(jq -r '.tagName' <<< "$view")" = "$expected"
          test "$(jq -r '.name' <<< "$view")" = "TuttiFrutti $expected"
          test "$(jq -r '.isDraft' <<< "$view")" = "false"
          test "$(jq -r '.assets | length' <<< "$view")" = "4"